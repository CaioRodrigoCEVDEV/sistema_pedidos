  <link rel="shortcut icon" href="/uploads/logo.jpg" type="image/x-icon" />
  <link rel="apple-touch-icon" sizes="180x180" href="/uploads/apple-touch-icon.png" />

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css" />

  <meta name="view-transition" content="same-origin" />

  <script src="/js/turbo.js?v=2026.09.24.111356" defer></script>

<body class="bg-light inter">
  <div class="wrapper">
    <header id="header">
    <!--Conteudo do header adicionado via JS-->
  </header>

    <main class="container py-4 ou-store-page">
      <div class="ou-page-header mb-3">
        <div class="ou-page-header__main">
          <span class="ou-page-header__icon"><i class="bi bi-phone"></i></span>
          <div>
            <span class="ou-page-header__eyebrow">Catálogo</span>
            <h1 class="ou-page-header__title">Modelos</h1>
            <p class="ou-page-header__sub mb-0">Selecione o modelo para ver os tipos de peça.</p>
          </div>
        </div>
        <div class="ou-page-header__actions">
          <button type="button" class="btn btn-secondary btn-sm" onclick="window.history.back();">
            <i class="bi bi-arrow-left"></i> Voltar
          </button>
        </div>
      </div>

      <div class="ou-store-card">
        <div class="ou-store-card__body">
          <ol class="ou-crumb mb-3">
            <li><a onclick="window.history.back();"><i class="bi bi-phone"></i><span id="marcaTitulo">Marca</span></a></li>
            <li><span class="ou-crumb__sep"><i class="bi bi-chevron-right"></i></span></li>
            <li><span class="ou-crumb__current">Modelos</span></li>
          </ol>
          <div class="input-group search-input shadow-sm mb-3">
            <span class="input-group-text" for="pesquisa">
              <i class="fa-solid fa-magnifying-glass"></i>
            </span>
            <input class="form-control" type="search" placeholder="Pesquisar modelo..." aria-label="Pesquisar" id="pesquisa">
            <button class="btn btn-primary d-flex align-items-center gap-2 ou-cart-btn" id="openCartModal" type="button">
              <i class="bi bi-cart2"></i><span>Carrinho</span>
            </button>
          </div>
          <div id="corpoTabela" class="ou-catalog-grid">
            <div class="ou-skeleton-grid" role="status" aria-busy="true" aria-label="Carregando modelos...">
              <span class="visually-hidden">Carregando modelos...</span>
              <div class="ou-skeleton-card"><span class="ou-skeleton ou-skeleton-card__icon"></span><span class="ou-skeleton-card__body"><span class="ou-skeleton ou-skeleton-line ou-skeleton-line--title"></span><span class="ou-skeleton ou-skeleton-line ou-skeleton-line--meta"></span></span></div>
              <div class="ou-skeleton-card"><span class="ou-skeleton ou-skeleton-card__icon"></span><span class="ou-skeleton-card__body"><span class="ou-skeleton ou-skeleton-line ou-skeleton-line--title"></span><span class="ou-skeleton ou-skeleton-line ou-skeleton-line--meta"></span></span></div>
              <div class="ou-skeleton-card"><span class="ou-skeleton ou-skeleton-card__icon"></span><span class="ou-skeleton-card__body"><span class="ou-skeleton ou-skeleton-line ou-skeleton-line--title"></span><span class="ou-skeleton ou-skeleton-line ou-skeleton-line--meta"></span></span></div>
              <div class="ou-skeleton-card"><span class="ou-skeleton ou-skeleton-card__icon"></span><span class="ou-skeleton-card__body"><span class="ou-skeleton ou-skeleton-line ou-skeleton-line--title"></span><span class="ou-skeleton ou-skeleton-line ou-skeleton-line--meta"></span></span></div>
              <div class="ou-skeleton-card"><span class="ou-skeleton ou-skeleton-card__icon"></span><span class="ou-skeleton-card__body"><span class="ou-skeleton ou-skeleton-line ou-skeleton-line--title"></span><span class="ou-skeleton ou-skeleton-line ou-skeleton-line--meta"></span></span></div>
              <div class="ou-skeleton-card"><span class="ou-skeleton ou-skeleton-card__icon"></span><span class="ou-skeleton-card__body"><span class="ou-skeleton ou-skeleton-line ou-skeleton-line--title"></span><span class="ou-skeleton ou-skeleton-line ou-skeleton-line--meta"></span></span></div>
            </div>
          </div>
          <div id="modelosSemResultado" class="ou-empty" style="display:none;">
            <span class="ou-empty__icon"><i class="bi bi-search"></i></span>
            <div class="ou-empty__title">Nenhum modelo encontrado.</div>
            <div class="ou-empty__text">Tente outro termo ou escolha outra marca.</div>
          </div>
        </div>
      </div>
    </main>
    <footer id="footer">
      <!--Conteudo do footer adicionado via JS-->
    </footer>
  </div>

  <!-- Modal do carrinho injetado via storefront-shared.js (ensureCartModal) -->

  <div class="ou-toast-container" id="ouToastContainer" aria-live="polite"></div>

      <script src="../js/componentes.js?v=2026.09.24.111356"></script>
      <script src="/config.js?v=2026.09.24.111356"></script>
      <script src="../js/nomeEmpresa.js?v=2026.09.24.111356"></script>
      <script src="../js/toast.js?v=2026.09.24.111356"></script>
      <script src="../js/storefront-shared.js?v=2026.09.24.111356"></script>
      <script src="../js/brand-logo.js?v=2026.09.24.111356"></script>
      <script src="../js/tipo-icon.js?v=2026.09.24.111356"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" data-turbo-eval="false"></script>
      <script src="../js/modelo.js?v=2026.09.24.111356"></script>
</body>

</html>
