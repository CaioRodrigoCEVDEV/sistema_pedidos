<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="manifest" href="/manifest.json?v=9d2557429d4e">
    <link rel="stylesheet" href="../css/style-index.css?v=2026.09.25.193400" data-turbo-track="dynamic" />
    <link rel="stylesheet" href="../css/style.css?v=2026.09.25.193400" data-turbo-track="dynamic">
    <link rel="stylesheet" href="../css/style-flexbox.css?v=2026.09.25.193400" data-turbo-track="dynamic">
    <link rel="shortcut icon" href="/uploads/logo.jpg?v=9d2557429d4e" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="/uploads/apple-touch-icon.png?v=9d2557429d4e">
    <!--links bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"/>

    <!--Fim link tema bootstrap-->
    <!--Design System OrderUp (mesmo da área logada)-->
    <link rel="stylesheet" href="/css/theme.css?v=2026.09.25.193400" data-turbo-track="dynamic" />
    <link rel="stylesheet" href="/css/ui.css?v=2026.09.25.193400" data-turbo-track="dynamic" />
    <link rel="stylesheet" href="../css/storefront.css?v=2026.09.25.193400" data-turbo-track="dynamic" />
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <meta name="view-transition" content="same-origin" />
  <script src="/js/ou-turbo.js?v=2026.09.25.193400"></script>
  <script src="/js/turbo.js?v=2026.09.25.193400" defer></script>
</head>

<body class="bg-light">
    <div class="wrapper">
        <header id="header">
            <!--Conteudo do header adicionado via JS-->
        </header>

        <main class="container py-4" style="max-width: 1100px;">
            <!-- Vitrines configuráveis (Destaques / Mais vendidos / Novidades).
                 Renderizadas por showcases.js; sem itens, a seção não aparece. -->
            <section class="ou-showcases mb-4" id="showcasesArea" aria-label="Vitrines de produtos" hidden></section>
            <!--Pesquisa-->
            <div class="ou-store-hero mb-3">
                <div class="input-group search-input w-100">
                    <span class="input-group-text" for="pesquisa">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </span>
                    <input class="form-control" type="search" placeholder="Pesquisar modelo..." aria-label="Pesquisar"
                        id="pesquisa">
                    <button class="btn btn-primary ou-cart-btn"
                           id="openCartModal" type="button" aria-label="Abrir carrinho">
                            <i class="bi bi-cart2"></i>
                            <span>Carrinho</span>
                    </button>
                </div>
            </div>
            <div id="cardsArea">
                <div class="container px-0">
                    <div id="marcaTitulo">
                        <div class="row g-3 g-lg-4" role="status" aria-busy="true" aria-label="Carregando marcas...">
                            <span class="visually-hidden">Carregando marcas...</span>
                            <div class="col-6 col-md-4 col-lg-3"><div class="ou-skeleton-brand"><span class="ou-skeleton ou-skeleton-brand__logo"></span><span class="ou-skeleton-brand__body"><span class="ou-skeleton ou-skeleton-line ou-skeleton-line--title"></span></span></div></div>
                            <div class="col-6 col-md-4 col-lg-3"><div class="ou-skeleton-brand"><span class="ou-skeleton ou-skeleton-brand__logo"></span><span class="ou-skeleton-brand__body"><span class="ou-skeleton ou-skeleton-line ou-skeleton-line--title"></span></span></div></div>
                            <div class="col-6 col-md-4 col-lg-3"><div class="ou-skeleton-brand"><span class="ou-skeleton ou-skeleton-brand__logo"></span><span class="ou-skeleton-brand__body"><span class="ou-skeleton ou-skeleton-line ou-skeleton-line--title"></span></span></div></div>
                            <div class="col-6 col-md-4 col-lg-3"><div class="ou-skeleton-brand"><span class="ou-skeleton ou-skeleton-brand__logo"></span><span class="ou-skeleton-brand__body"><span class="ou-skeleton ou-skeleton-line ou-skeleton-line--title"></span></span></div></div>
                            <div class="col-6 col-md-4 col-lg-3"><div class="ou-skeleton-brand"><span class="ou-skeleton ou-skeleton-brand__logo"></span><span class="ou-skeleton-brand__body"><span class="ou-skeleton ou-skeleton-line ou-skeleton-line--title"></span></span></div></div>
                            <div class="col-6 col-md-4 col-lg-3"><div class="ou-skeleton-brand"><span class="ou-skeleton ou-skeleton-brand__logo"></span><span class="ou-skeleton-brand__body"><span class="ou-skeleton ou-skeleton-line ou-skeleton-line--title"></span></span></div></div>
                            <div class="col-6 col-md-4 col-lg-3"><div class="ou-skeleton-brand"><span class="ou-skeleton ou-skeleton-brand__logo"></span><span class="ou-skeleton-brand__body"><span class="ou-skeleton ou-skeleton-line ou-skeleton-line--title"></span></span></div></div>
                            <div class="col-6 col-md-4 col-lg-3"><div class="ou-skeleton-brand"><span class="ou-skeleton ou-skeleton-brand__logo"></span><span class="ou-skeleton-brand__body"><span class="ou-skeleton ou-skeleton-line ou-skeleton-line--title"></span></span></div></div>
                        </div>
                        <!--Conteudo inserido via js marcas cadastradas-->
                    </div>
                </div>
            </div>
            <div class="container px-0" id="tabelaArea" style="display:none;">
                <div class="ou-results-head">
                    <div class="ou-results-head__heading">
                        <h2 class="ou-results-head__title">Modelos encontrados</h2>
                        <p class="ou-results-head__sub mb-0">Selecione um modelo para continuar.</p>
                    </div>
                    <span class="ou-results-head__count" id="resultadoQuantidade" aria-live="polite"></span>
                </div>
                <div id="corpoTabela" class="ou-result-list">
                    <!--Modelos encontrados inseridos via js-->
                </div>
            </div>
        </main>

        <div>
            <!-- Botão oculto que só aparece quando o Chrome liberar o install prompt -->
            <button id="btnInstall" class="btn" type="button">
                <i class="bi bi-download"></i>
                <span>Instalar App</span>
            </button>
        </div>
        <footer id="footer">
            <!--Conteudo do footer adicionado via JS-->
        </footer>
    </div>
    <!-- Botão do carrinho flutuante -->


    <!-- Modal do carrinho injetado via storefront-shared.js (ensureCartModal) -->

    <div class="ou-toast-container" id="ouToastContainer" aria-live="polite"></div>


    <script src="../js/componentes.js?v=2026.09.25.193400"></script>
    <script src="../js/nomeEmpresa.js?v=2026.09.25.193400"></script>
    <script src="/config.js?v=2026.09.25.193400"></script>
    <script src="../js/toast.js?v=2026.09.25.193400"></script>
    <script src="../js/storefront-shared.js?v=2026.09.25.193400"></script>
    <script src="../js/brand-logo.js?v=2026.09.25.193400"></script>
    <script src="../js/tipo-icon.js?v=2026.09.25.193400"></script>
    <script src="../js/showcases.js?v=2026.09.25.193400"></script>
    <script src="../js/color-picker.js?v=2026.09.25.193400"></script>
    <script src="../js/index.js?v=2026.09.25.193400"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous" data-turbo-eval="false"></script>
</body>

</html>
