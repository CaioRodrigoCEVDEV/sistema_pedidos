<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="title"></title>
    <script src="../js/theme-manager.js?v=2026.09.15.185723"></script>
    <!--Link proprios projeto-->
    <link rel="stylesheet" href="../css/style.css?v=2026.09.15.185723" />
    <link rel="stylesheet" href="../css/style-flexbox.css?v=2026.09.15.185723" />
    <link rel="shortcut icon" href="/uploads/logo.jpg" type="image/x-icon" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/uploads/apple-touch-icon.png"
    />
    <!--links bootstrap-->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!--link tema bootstrap-->
    <link rel="stylesheet" href="../css/tema-bootstrap.css?v=2026.09.15.185723" />
    <!--Fim link tema bootstrap-->
    <link rel="stylesheet" href="../css/theme.css?v=2026.09.15.185723" />
    <link rel="stylesheet" href="../css/ui.css?v=2026.09.15.185723" />
    <link rel="stylesheet" href="../css/storefront.css?v=2026.09.15.185723" />
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <div class="wrapper">
      <header id="header">
        <!--Conteudo do header adicionado via JS-->
      </header>

      <main class="container py-4 ou-store-page">
        <div class="ou-page-header mb-3">
          <div class="ou-page-header__main">
            <span class="ou-page-header__icon"><i class="bi bi-cart2"></i></span>
            <div>
              <span class="ou-page-header__eyebrow">Pedido</span>
              <h1 class="ou-page-header__title">Carrinho de compras</h1>
              <p class="ou-page-header__sub mb-0">Revise os itens e finalize pelo WhatsApp ou como pedido.</p>
            </div>
          </div>
          <div class="ou-page-header__actions">
            <button class="btn btn-secondary btn-sm" id="btnLimparCarrinho" type="button">
              <i class="bi bi-trash"></i> Limpar
            </button>
            <button class="btn btn-secondary btn-sm" id="btnVoltar" type="button">
              <i class="bi bi-arrow-left"></i> Voltar
            </button>
          </div>
        </div>

        <div class="ou-store-card">
          <div class="ou-store-card__body">
            <div id="carrinhoCorpo" class="ou-result-list mt-1">
              <!-- Itens do carrinho serão inseridos aqui via JavaScript -->
            </div>
            <div class="d-flex justify-content-end align-items-center mt-3" id="carrinhoTotal">
              <h3 class="h5 mb-0">Valor total: <span id="totalCarrinho">R$ 0,00</span></h3>
            </div>
            <div class="mt-3">
              <label class="form-label" for="observacoes">Observações</label>
              <textarea
                id="observacoes"
                class="form-control"
                rows="3"
                placeholder="Digite suas observações aqui..."
              ></textarea>
            </div>
            <div
              class="row g-2 align-items-center mt-3"
              id="divFinalizar"
            >
              <div class="col-12 col-sm-6 col-lg-3">
                <button
                  id="btnBalcao"
                  class="btn btn-success w-100"
                  type="button"
                >
                  <i class="bi bi-shop me-1"></i> Retirada Balcão
                </button>
              </div>
              <div class="col-12 col-sm-6 col-lg-3">
                <button
                  id="btnEntrega"
                  class="btn btn-danger w-100"
                  type="button"
                >
                  <i class="bi bi-truck me-1"></i> Entrega
                </button>
              </div>
              <div class="col-12 col-sm-6 col-lg-3">
                <button
                  id="botao-orcamento"
                  class="btn btn-warning w-100"
                  style="display: none"
                  type="button"
                >
                  <i class="bi bi-clipboard me-1"></i> Copiar
                </button>
              </div>
              <div class="col-12 col-sm-6 col-lg-3">
                <button
                  id="botao-registrar-pedido"
                  class="btn btn-primary w-100"
                  style="display: none"
                  type="button"
                >
                  <i class="bi bi-check-lg me-1"></i> Registrar Pedido
                </button>
              </div>
            </div>
          </div>
        </div>
      </main>
      <footer id="footer">
        <!--Conteudo do footer adicionado via JS-->
      </footer>
    </div>

    <!-- Modal de confirmação: Registrar Pedido -->
    <div
      class="modal fade"
      id="confirmarRegistroModal"
      tabindex="-1"
      aria-labelledby="confirmarRegistroModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <div class="modal-header">
            <div>
              <h2 class="modal-title h5 mb-1" id="confirmarRegistroModalLabel">
                <i class="bi bi-check2-circle text-primary me-1"></i>Registrar
                pedido
              </h2>
              <div class="small text-muted">
                O pedido será finalizado e o carrinho esvaziado.
              </div>
            </div>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Fechar"
            ></button>
          </div>
          <div class="modal-body">
            <p class="mb-0">
              Deseja realmente registrar este pedido?
            </p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-outline-secondary"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>
            <button type="button" id="confirmarRegistroBtn" class="btn btn-primary">
              <i class="bi bi-check-lg me-1"></i>Registrar pedido
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="ou-toast-container" id="ouToastContainer" aria-live="polite"></div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="../js/componentes.js?v=2026.09.15.185723"></script>
    <script src="/config.js?v=2026.09.15.185723"></script>
    <script src="../js/toast.js?v=2026.09.15.185723"></script>
    <script src="../js/storefront-shared.js?v=2026.09.15.185723"></script>
    <script src="../js/carrinho.js?v=2026.09.15.185723"></script>
    <script src="../js/nomeEmpresa.js?v=2026.09.15.185723"></script>
  </body>
</html>
