<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8" />
  <script src="/js/theme-manager.js?v=2026.09.20.223747"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="title"></title>
  <link rel="shortcut icon" href="/uploads/logo.jpg" type="image/x-icon" />
  <link rel="apple-touch-icon" sizes="180x180" href="/uploads/apple-touch-icon.png" />
  <!--Links proprios-->
  <link rel="stylesheet" href="/html/auth/admin/css/style-flexbox.css?v=2026.09.20.223747" data-turbo-track="dynamic" />
  <link rel="stylesheet" href="/html/auth/admin/css/style-painel.css?v=2026.09.20.223747" data-turbo-track="dynamic" />
  <link rel="stylesheet" href="/html/auth/admin/css/style-components.css?v=2026.09.20.223747" data-turbo-track="dynamic" />
  <link rel="stylesheet" href="/html/auth/admin/css/style.css?v=2026.09.20.223747" data-turbo-track="dynamic" />
  <!--links bootstrap-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <!--Link tema personalizado bootstrap-->
  <link rel="stylesheet" href="/css/tema-bootstrap.css?v=2026.09.20.223747" data-turbo-track="dynamic" />
  <!--link tema-->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/html/auth/admin/css/style-painel-backups.css?v=2026.09.20.223747" data-turbo-track="dynamic" />

  <link rel="stylesheet" href="/css/theme.css?v=2026.09.20.223747" data-turbo-track="dynamic" />
  <link rel="stylesheet" href="/css/shell.css?v=2026.09.20.223747" data-turbo-track="dynamic" />
  <link rel="stylesheet" href="/css/ui.css?v=2026.09.20.223747" data-turbo-track="dynamic" />
  <meta name="turbo-cache-control" content="no-cache" />
  <meta name="view-transition" content="same-origin" />
  <script src="/js/ou-turbo.js?v=2026.09.20.223747"></script>
  <script src="/js/turbo.js?v=2026.09.20.223747" defer></script>
</head>

<body class="bg-light">
  <div class="wrapper">
    <header id="header-admin">
      <!--Conteudo do header adicionado via JS-->
    </header>
    <main class="p-3">
      <div class="container">
        <div class="ou-page-header mb-4">
          <div class="ou-page-header__main">
            <span class="ou-page-header__icon" aria-hidden="true">
              <i class="bi bi-database-gear"></i>
            </span>
            <div>
              <span class="ou-page-header__eyebrow">Ferramentas</span>
              <h1 class="h4 mb-0 ou-page-header__title">Backups</h1>
              <p class="ou-page-header__sub mb-0">
                Backups diários dos dados do sistema.
              </p>
            </div>
          </div>
          <div class="ou-page-header__actions">
            <button type="button" class="btn btn-secondary" id="btnRefresh">
              <i class="bi bi-arrow-clockwise"></i> Atualizar
            </button>
          </div>
        </div>
      </div>

      <div class="container">
        <div class="app-container">
          <div class="card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center gap-3">
              <div class="d-flex align-items-center gap-2">
                <i class="bi bi-folder2-open"></i>
                <h5 class="mb-0">Arquivos de backup</h5>
              </div>
              <nav aria-label="Caminho das pastas" class="ou-backup-crumbs">
                <ol class="breadcrumb mb-0" id="crumbs"></ol>
              </nav>
            </div>

            <div class="card-body border-bottom">
              <div class="ou-filter">
                <div class="ou-filter__item flex-grow-1" style="min-width: 220px;">
                  <label for="q" class="form-label">Buscar</label>
                  <div class="input-group search-input">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input id="q" class="form-control" type="search" placeholder="Filtrar por nome...">
                  </div>
                </div>
                <div class="ou-filter__item">
                  <label for="ext" class="form-label">Tipo de arquivo</label>
                  <select id="ext" class="form-select">
                    <option value="">Todos</option>
                    <option value=".tgz">.tgz</option>
                    <option value=".log">.log</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="card-body p-0">
              <div class="table-responsive">
                <table id="tbl" class="table table-hover align-middle mb-0">
                  <thead>
                    <tr>
                      <th data-k="nome">Nome</th>
                      <th class="text-end" data-k="tamanhoKB">Tamanho</th>
                      <th class="text-end">Ações</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>

              <div id="emptyState" class="ou-empty" style="display: none">
                <span class="ou-empty__icon" aria-hidden="true"><i class="bi bi-inbox"></i></span>
                <span class="ou-empty__title" id="emptyTitle">Nenhum backup encontrado</span>
                <span class="ou-empty__text" id="emptyText">Não há arquivos ou pastas neste diretório.</span>
              </div>

              <div id="loadingState" class="ou-loading" style="display: none">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">Carregando...</span>
                </div>
                <span>Carregando backups...</span>
              </div>
            </div>

            <div class="card-footer d-flex justify-content-between align-items-center flex-wrap gap-2">
              <small id="resultsInfo" class="text-muted">0 item(ns)</small>
              <small class="text-muted">
                <i class="bi bi-info-circle me-1"></i>
                Os arquivos são baixados diretamente do servidor.
              </small>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer id="footer">
      <!--Conteudo do footer adicionado via JS-->
    </footer>
  </div>

  <script src="html/auth/js/componentes.js?v=2026.09.20.223747"></script>
  <script src="/config.js?v=2026.09.20.223747"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="../js/nomeEmpresa.js?v=2026.09.20.223747"></script>
  <script src="html/auth/js/painel-backups.js?v=2026.09.20.223747"></script>

</body>

</html>
