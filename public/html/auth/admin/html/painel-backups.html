  <link rel="shortcut icon" href="/uploads/logo.jpg" type="image/x-icon" />
  <link rel="apple-touch-icon" sizes="180x180" href="/uploads/apple-touch-icon.png" />
  <!--Links proprios-->
  <link rel="stylesheet" href="/html/auth/admin/css/style-flexbox.css?v=2026.09.12.135306" />
  <link rel="stylesheet" href="/html/auth/admin/css/style-painel.css?v=2026.09.12.135306" />
  <link rel="stylesheet" href="/html/auth/admin/css/style-components.css?v=2026.09.12.135306" />

    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <!--Link tema personalizado bootstrap-->
  <link rel="stylesheet" href="../../../../css/tema-bootstrap.css?v=2026.09.12.135306" />
  <!--link tema-->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"

  <link rel="stylesheet" href="/css/theme.css?v=2026.09.12.135306" />

  <link rel="stylesheet" href="/css/ui.css?v=2026.09.12.135306" />
</head>

<body>
  <div class="wrapper">
    <header id="header-admin">
      <!--Conteudo do header adicionado via JS-->
    </header>
    <main class="p-3">
      <div class="container">
        <div class="ou-page-header mb-4">
          <div class="ou-page-header__main">
            <span class="ou-page-header__icon" aria-hidden="true">
              <i class="bi bi-database-gear"></i>
            </span>
            <div>
              <span class="ou-page-header__eyebrow">Ferramentas</span>
              <h1 class="h4 mb-0 ou-page-header__title">Backups</h1>
              <p class="ou-page-header__sub mb-0">
                Backups diários dos dados do sistema.
              </p>
            </div>
          </div>
        </div>
        <div class="wrap">
          <div class="toolbar">
            <div class="input-group search-input" style="max-width: 360px;">
              <span class="input-group-text"><i class="bi bi-search"></i></span>
              <input id="q" class="form-control" type="search" placeholder="Filtrar por nome...">
            </div>
            <select id="ext" class="form-select" style="max-width: 170px;">
              <option value="">Todas</option>
              <option>.tgz</option>
              <option>.log</option>
            </select>
            <span class="muted" id="status"></span>
          </div>

          <div class="card shadow-sm">
            <div class="table-responsive">
              <table id="tbl" class="table table-hover align-middle mb-0">
                <thead>
                  <tr>
                    <th data-k="nome">Arquivo</th>
                    <th class="right" data-k="tamanhoKB">Tamanho (KB)</th>
                    <th>Ações</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer id="footer">
      <!--Conteudo do footer adicionado via JS-->
    </footer>
  </div>

  <script src="html/auth/js/componentes.js?v=2026.09.12.135306"></script>
  <script src="/config.js?v=2026.09.12.135306"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="../js/nomeEmpresa.js?v=2026.09.12.135306"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script src="html/auth/js/painel-backups.js?v=2026.09.12.135306"></script>

</body>

</html>
