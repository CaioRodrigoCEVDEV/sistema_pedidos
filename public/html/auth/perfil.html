<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8" />
  <script src="/js/theme-manager.js?v=2026.09.11.233405"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="title"></title>
    <link rel="shortcut icon" href="/uploads/logo.jpg" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="/uploads/apple-touch-icon.png">
    <!--Links Internos-->
    <link rel="stylesheet" href="/html/auth/admin/css/style-flexbox.css?v=2026.09.11.233405">
    <link rel="stylesheet" href="/html/auth/admin/css/style-components.css?v=2026.09.11.233405">
    <!--Links Externos-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"/>
    <!--Link tema bootstrap-->
  <link rel="stylesheet" href="../../css/tema-bootstrap.css?v=2026.09.11.233405"/>
  <!--Fim Link tema bootstrap-->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/theme.css?v=2026.09.11.233405" />
  <link rel="stylesheet" href="/css/shell.css?v=2026.09.11.233405" />
</head>

<body class="bg-light">
    <div class="wrapper">
        <header id="header-admin">
            <!--Conteudo do header adicionado via JS-->
        </header>

        <main class="p-3">
            <div class="container">
                <div class="panel-hero mb-4">
                    <div class="panel-hero__main">
                        <span class="panel-hero__icon" aria-hidden="true">
                            <i class="bi bi-person-circle"></i>
                        </span>
                        <div>
                            <span class="panel-hero__eyebrow">Preferências</span>
                            <h1 class="h4 mb-0 panel-hero__title">Meu perfil</h1>
                            <p class="panel-hero__sub mb-0">
                                Gerencie suas informações pessoais e credenciais.
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="container">
                <div class="row g-4 perfil-grid">
                    <div class="col-lg-8">
                        <form id="formPerfil" novalidate>
                            <div class="card panel-card">
                                <div class="card-body p-4">
                                    <h6 class="text-uppercase text-muted fw-semibold small mb-3">
                                        Informações da conta
                                    </h6>
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label class="form-label" for="nome">Nome</label>
                                            <input type="text" class="form-control" id="nome" autocomplete="name" required>
                                            <div class="invalid-feedback">Informe seu nome.</div>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label" for="email">E-mail</label>
                                            <input type="email" class="form-control" id="email" autocomplete="email" disabled>
                                            <div class="form-text">O e-mail de acesso não pode ser alterado.</div>
                                        </div>
                                    </div>

                                    <hr class="my-4" />

                                    <h6 class="text-uppercase text-muted fw-semibold small mb-3">
                                        Alterar senha
                                    </h6>
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label class="form-label" for="senha">Nova senha</label>
                                            <div class="input-group">
                                                <input type="password" class="form-control" id="senha"
                                                    placeholder="Digite a nova senha" autocomplete="new-password" required>
                                                <button type="button" class="btn btn-outline-secondary js-toggle-senha"
                                                    data-target="senha" aria-label="Mostrar senha" title="Mostrar/ocultar senha">
                                                    <i class="bi bi-eye"></i>
                                                </button>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label" for="confirmarSenha">Repetir nova senha</label>
                                            <div class="input-group">
                                                <input type="password" class="form-control" id="confirmarSenha"
                                                    placeholder="Repita a nova senha" autocomplete="new-password" required>
                                                <button type="button" class="btn btn-outline-secondary js-toggle-senha"
                                                    data-target="confirmarSenha" aria-label="Mostrar senha" title="Mostrar/ocultar senha">
                                                    <i class="bi bi-eye"></i>
                                                </button>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="form-text">
                                                Escolha uma nova senha e repita o valor para confirmar a alteração.
                                            </div>
                                            <div class="text-danger small mt-1 d-none" id="erroSenha" role="alert"></div>
                                        </div>
                                    </div>
                                </div>

                                <div class="card-footer bg-transparent d-flex justify-content-end gap-2 py-3 px-4">
                                    <button type="submit" class="btn btn-primary" id="btnSalvar">
                                        <i class="bi bi-check2 me-1"></i> Salvar alterações
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>

                    <div class="col-lg-4">
                        <div class="card panel-card">
                            <div class="card-body text-center p-4">
                                <div class="icon-circle perfil-avatar bg-grad-1 mx-auto mb-3 fw-semibold" id="perfilAvatar"
                                    aria-hidden="true">OU</div>
                                <h5 class="mb-1 fw-semibold text-truncate" id="perfilNome">Usuário</h5>
                                <div class="text-muted small text-break" id="perfilEmail">—</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer id="footer">
            <!--Conteudo do footer adicionado via JS-->
        </footer>
    </div>
    <script src="/config.js?v=2026.09.11.233405"></script>
    <script src="/js/toast.js?v=2026.09.11.233405"></script>
    <script src="/html/auth/js/componentes.js?v=2026.09.11.233405"></script>
    <script src="../js/nomeEmpresa.js?v=2026.09.11.233405"></script>
    <script src="/html/auth/js/perfil.js?v=2026.09.11.233405"></script>
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>

</html>
