<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="title"></title>
  <script src="../js/theme-manager.js?v=2026.09.14.103903"></script>
  <!--Link proprios projeto-->
  <link rel="stylesheet" href="../css/style.css?v=2026.09.14.103903" />
  <link rel="stylesheet" href="../css/style-pecas.css?v=2026.09.14.103903" />
  <link rel="stylesheet" href="/html/auth/admin/css/style-flexbox.css?v=2026.09.14.103903" />
  <link rel="shortcut icon" href="/uploads/logo.jpg" type="image/x-icon" />
  <link rel="apple-touch-icon" sizes="180x180" href="/uploads/apple-touch-icon.png" />
  <!--links bootstrap-->

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <!--link tema bootstrap-->
  <link rel="stylesheet" href="../css/tema-bootstrap.css?v=2026.09.14.103903" />
  <!--Fim link tema bootstrap-->
  <link rel="stylesheet" href="../css/theme.css?v=2026.09.14.103903" />
  <link rel="stylesheet" href="../css/ui.css?v=2026.09.14.103903" />
  <link rel="stylesheet" href="../css/storefront.css?v=2026.09.14.103903" />
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="bg-light">
  <div class="wrapper">
    <header id="header">
      <!--Conteudo do header adicionado via JS-->
    </header>

    <main class="container py-4 ou-store-page">
      <div class="ou-page-header mb-3">
        <div class="ou-page-header__main">
          <span class="ou-page-header__icon"><i class="bi bi-tools"></i></span>
          <div>
            <span class="ou-page-header__eyebrow">Catálogo</span>
            <h1 class="ou-page-header__title">Tipos de peça</h1>
            <p class="ou-page-header__sub mb-0">Selecione o tipo para ver as peças disponíveis.</p>
          </div>
        </div>
        <div class="ou-page-header__actions">
          <button type="button" class="btn btn-secondary btn-sm" onclick="window.history.back();">
            <i class="bi bi-arrow-left"></i> Voltar
          </button>
        </div>
      </div>

      <div class="ou-store-card">
        <div class="ou-store-card__body">
          <ol class="ou-crumb mb-3">
            <li><a onclick="window.history.go(-2);"><i class="bi bi-phone"></i><span id="marcaTitulo">Marca</span></a></li>
            <li><span class="ou-crumb__sep"><i class="bi bi-chevron-right"></i></span></li>
            <li><a onclick="window.history.back();"><span id="modeloTitulo">Modelo</span></a></li>
            <li><span class="ou-crumb__sep"><i class="bi bi-chevron-right"></i></span></li>
            <li><span class="ou-crumb__current">Tipos</span></li>
          </ol>
          <div class="input-group search-input shadow-sm mb-3">
            <span class="input-group-text" for="pesquisa">
              <i class="fa-solid fa-magnifying-glass"></i>
            </span>
            <input class="form-control" type="search" placeholder="Pesquisar tipo..." aria-label="Pesquisar" id="pesquisa">
            <button class="btn btn-primary d-flex align-items-center gap-2 ou-cart-btn" id="openCartModal" type="button">
              <i class="bi bi-cart2"></i><span>Carrinho</span>
            </button>
          </div>
          <div id="corpoTabela" class="ou-result-list">
            <div class="ou-loading"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Carregando...</span></div><span>Carregando tipos...</span></div>
          </div>
        </div>
      </div>
    </main>
    <footer id="footer">
      <!--Conteudo do footer adicionado via JS-->
    </footer>
  </div>

  <!-- Modal do carrinho injetado via storefront-shared.js (ensureCartModal) -->

  <div class="ou-toast-container" id="ouToastContainer" aria-live="polite"></div>

      <script src="../js/componentes.js?v=2026.09.14.103903"></script>
      <script src="/config.js?v=2026.09.14.103903"></script>
      <script src="../js/storefront-shared.js?v=2026.09.14.103903"></script>
      <script src="../js/pecas.js?v=2026.09.14.103903"></script>
      <script src="../js/nomeEmpresa.js?v=2026.09.14.103903"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
